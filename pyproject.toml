[project]
name = "questionagent"
version = "0.1.0"
description = "Reads a question file from ./input, researches it with web search + scraping, and outputs a formatted HTML result."
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-deepseek",
    "langchain-google-genai",
    "python-dotenv",
    "tavily-python",
    "trafilatura",
    "markdown",
    "jinja2",
]

[project.scripts]
questionAgent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]